<!doctype html>

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installed app on iOS and Android. The layout pads env(safe-area-inset-top),
         so the translucent status bar sits over the navy page. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Unravel" />

    <!-- Basic Meta Tags -->
    <title>Unravel · Good questions for friends, dates and partners</title>
    <meta
      name="description"
      content="Unravel is a card game of good questions for friends, first dates and partners. Pick a deck, pass the phone and get talking."
    />
    <meta name="author" content="Tiago Costa, tiagocostadev.com" />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta
      property="og:title"
      content="Unravel · Good questions for friends, dates and partners"
    />
    <meta
      property="og:description"
      content="Unravel is a card game of good questions for friends, first dates and partners. Pick a deck, pass the phone and get talking."
    />
    <meta
      property="og:image"
      content="https://unravel.tiagocostadev.com/og/unravel.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://unravel.tiagocostadev.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Unravel · Good questions for friends, dates and partners"
    />
    <meta
      name="twitter:description"
      content="Unravel is a card game of good questions for friends, first dates and partners. Pick a deck, pass the phone and get talking."
    />
    <meta
      name="twitter:image"
      content="https://unravel.tiagocostadev.com/og/unravel.png"
    />

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://unravel.tiagocostadev.com/" />
    <!-- The navy default theme. main.tsx rewrites both per theme (day is light). -->
    <meta name="theme-color" content="#232946" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
